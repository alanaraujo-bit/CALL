[package]
name = "call"
version = "0.10.2"
description = "Comunicacao em grupo com voz e transmissao de tela"
authors = ["CALL"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "call_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "tray-icon": o app roda em segundo plano com o ícone na bandeja, em vez de
# encerrar quando a janela fecha — é o que permite ao atalho de mudo global
# continuar valendo com a interface fechada.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
# Atalho global de mudo: precisa funcionar com a janela sem foco, ou mesmo
# escondida na bandeja — um `keydown` do lado da interface não alcança
# nenhum dos dois casos.
tauri-plugin-global-shortcut = "2"
# Protocolo call://, para o convite virar um clique em vez de um código
# colado a mao. O single-instance e quem entrega a URL quando o aplicativo
# ja esta aberto: sem ele, cada clique no link abriria uma instancia nova.
tauri-plugin-deep-link = "2"
# A opcao `deep-link` e quem faz a segunda instancia entregar a URL a primeira
# em vez de so morrer: sem ela, clicar no link com o CALL aberto nao faria nada.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Sem rustls e sem zip: no Windows o TLS vem do proprio sistema (Schannel) e o
# pacote de atualizacao e o instalador .exe, nao um arquivo compactado. As duas
# opcoes padrao custariam centenas de KB no instalador sem servir a nada aqui.
tauri-plugin-updater = { version = "2", default-features = false, features = [
  "native-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
wasapi = "0.23.0"
# PKCE do login com o Google: o desafio e o resumo SHA-256 do verificador
# sorteado a cada tentativa. Ver `src/google.rs`.
sha2 = "0.10"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
# Abrir o navegador padrao no endereco do Google. A versao acompanha a que o
# `webview2-com` ja traz — duas versoes do mesmo `windows` seriam duas copias
# das mesmas ligacoes dentro do executavel.
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
