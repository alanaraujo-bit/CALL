[package]
name = "call"
version = "0.1.0"
description = "Comunicacao em grupo com voz e transmissao de tela"
authors = ["CALL"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "call_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
