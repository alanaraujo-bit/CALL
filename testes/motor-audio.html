<!doctype html>
<html lang="pt-BR">
  <head><meta charset="UTF-8" /><title>Teste do motor de áudio</title></head>
  <body>
    <!-- O nonce casa com o que `servir.mjs` põe no cabeçalho: esta página roda
         sob a CSP real do aplicativo, porque é ela que decide se o WASM e o
         worklet do filtro neural podem carregar. -->
    <script type="module" nonce="motor-audio">
      import { AUDIO_PADRAO, MotorDeAudio } from "../src/audio.js";
      import { Supressao } from "../src/supressao.js";

      const relatorio = [];
      let falhas = 0;
      const conferir = (condicao, descricao) => {
        if (!condicao) falhas++;
        relatorio.push({ ok: Boolean(condicao), descricao });
      };
      const entregar = (dados) =>
        fetch("http://127.0.0.1:8123/resultado", {
          method: "POST",
          body: JSON.stringify(dados, null, 2),
        }).catch(() => {});
      const esperar = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const microfoneReal = new URLSearchParams(location.search).get("microfone") === "real";
      const testarReabertura = new URLSearchParams(location.search).get("reabrir") === "sim";

      const motor = new MotorDeAudio();
      const niveis = [];
      const pararNivel = motor.assinarNivel((dados) => niveis.push(dados));
      const contextoEntrada = new AudioContext({ sampleRate: 48000 });
      const getUserMediaReal = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
      let fonteFala = null;
      let fluxoEntrada;

      if (microfoneReal) {
        fluxoEntrada = await getUserMediaReal({
          audio: {
            echoCancellation: true,
            noiseSuppression: false,
            autoGainControl: true,
            channelCount: 1,
            sampleRate: 48000,
          },
          video: false,
        });
      } else {
        const respostaFala = await fetch("/target/teste-fala.wav");
        const fala = await contextoEntrada.decodeAudioData(await respostaFala.arrayBuffer());
        fonteFala = contextoEntrada.createBufferSource();
        const destinoFala = contextoEntrada.createMediaStreamDestination();
        fonteFala.buffer = fala;
        fonteFala.loop = true;
        fonteFala.connect(destinoFala);
        fonteFala.start();
        fluxoEntrada = destinoFala.stream;
      }

      // Mede a captura antes de qualquer filtro e entrega a mesma trilha ao
      // motor. Assim um único ensaio mostra exatamente em qual lado o sinal some.
      const fonteEntrada = contextoEntrada.createMediaStreamSource(fluxoEntrada);
      const analisadorEntrada = contextoEntrada.createAnalyser();
      analisadorEntrada.fftSize = 512;
      const consumidorEntrada = contextoEntrada.createGain();
      consumidorEntrada.gain.value = 0;
      fonteEntrada.connect(analisadorEntrada);
      analisadorEntrada.connect(consumidorEntrada);
      consumidorEntrada.connect(contextoEntrada.destination);
      navigator.mediaDevices.getUserMedia = async () =>
        new MediaStream(fluxoEntrada.getAudioTracks().map((trilha) => trilha.clone()));

      try {
        if (testarReabertura) {
          const primeiroMotor = new MotorDeAudio();
          await primeiroMotor.aplicar(AUDIO_PADRAO);
          await primeiroMotor.abrirMicrofone();
          await esperar(800);
          await primeiroMotor.encerrar();
        }
        await motor.aplicar(AUDIO_PADRAO);
        const fluxo = await motor.abrirMicrofone();
        conferir(fluxo.getAudioTracks().length === 1, "o motor entrega uma trilha tratada");

        // Consumir a trilha exatamente como o LiveKit/WebRTC faz. O ganho em
        // zero mantém o teste inaudível, mas deixa o grafo sendo renderizado.
        const contexto = await motor.contexto();
        const fonte = contexto.createMediaStreamSource(fluxo);
        const analisador = contexto.createAnalyser();
        analisador.fftSize = 512;
        const silencioso = contexto.createGain();
        silencioso.gain.value = 0;
        fonte.connect(analisador);
        analisador.connect(silencioso);
        silencioso.connect(contexto.destination);

        const dados = new Uint8Array(analisador.fftSize);
        const dadosEntrada = new Uint8Array(analisadorEntrada.fftSize);
        let pico = 0;
        let picoEntrada = 0;
        const fim = performance.now() + (microfoneReal ? 10_000 : 2500);
        while (performance.now() < fim) {
          analisador.getByteTimeDomainData(dados);
          analisadorEntrada.getByteTimeDomainData(dadosEntrada);
          for (const amostra of dados) pico = Math.max(pico, Math.abs(amostra - 128));
          for (const amostra of dadosEntrada)
            picoEntrada = Math.max(picoEntrada, Math.abs(amostra - 128));
          await esperar(30);
        }

        const trilhaEntrada = fluxoEntrada.getAudioTracks()[0];
        conferir(
          picoEntrada > 2,
          `o microfone bruto entrega áudio (pico ${picoEntrada}; ${trilhaEntrada?.label || "sem rótulo"})`
        );
        conferir(pico > 2, `a cadeia completa mantém áudio na trilha (pico ${pico})`);
        conferir(niveis.length > 10, `a porta reporta nível continuamente (${niveis.length} leituras)`);
        conferir(
          niveis.some((item) => item.nivel > -70),
          `o detector recebe sinal (${Math.max(...niveis.map((item) => item.nivel)).toFixed(1)} dB)`
        );

        // Qual supressor atendeu. Não é uma asserção de qualidade — nenhum
        // teste automático ouve ruído —, mas responde a pergunta que separa
        // "o filtro neural não limpa" de "o filtro neural nem entrou no
        // caminho", que é onde a investigação sempre começa.
        //
        // O GTCRN é um nó de grafo (`AudioWorkletNode`), não um processador de
        // trilha. Diferente do Krisp, ele não aplica constraints de dispositivo
        // na trilha recebida, então trata qualquer fonte — inclusive a trilha
        // sintética do `MediaStreamAudioDestinationNode` deste ensaio. Por isso
        // o motor esperado é `neural` nos dois modos: se o GTCRN carregou e
        // montou no grafo, ele vale para qualquer microfone.
        const supressao = motor.supressao;
        const ondeParou = `motor: ${supressao.motor}${
          supressao.causa ? ` — ${supressao.causa}` : supressao.detalhe ? ` — ${supressao.detalhe}` : ""
        }`;
        conferir(
          supressao.motor === "neural",
          `o filtro neural entra no caminho do microfone (${ondeParou})`
        );
        // A porta em cima da rede neural come sílaba: o piso que ela mede
        // desaba para perto do silêncio digital. Ver `portaFazSentido`.
        conferir(
          supressao.motor !== "neural" || !supressao.portaFazSentido,
          "a porta de ruído fica em repouso quando o filtro neural está valendo"
        );
        // Só se pode exigir onde existe fala garantida. No modo de microfone
        // real a sala pode estar em silêncio, e "ninguém falou" não é defeito
        // do detector.
        if (!microfoneReal) {
          conferir(
            niveis.some((item) => item.falando),
            "o detector de fala continua reportando com a porta em repouso"
          );
        }

        // A troca de canal de voz: `soltarMicrofone()` + `abrirMicrofone()`
        // com o filtro neural vivo entre os dois. O nó tem de sobreviver (é o
        // mesmo contexto) e o motor não pode ter caído para o nativo.
        // Contar o nó não basta: uma fonte que não volta a ligar nele passaria.
        // Por isso mede áudio de novo, agora na trilha reaberta.
        fonte.disconnect();
        motor.soltarMicrofone();
        const fluxoReaberto = await motor.abrirMicrofone();
        const fonteReaberta = contexto.createMediaStreamSource(fluxoReaberto);
        fonteReaberta.connect(analisador);
        let picoReaberto = 0;
        const fimReaberto = performance.now() + (microfoneReal ? 5000 : 1500);
        while (performance.now() < fimReaberto) {
          analisador.getByteTimeDomainData(dados);
          for (const amostra of dados) picoReaberto = Math.max(picoReaberto, Math.abs(amostra - 128));
          await esperar(30);
        }
        fonteReaberta.disconnect();
        conferir(
          supressao.motor === "neural" && supressao.no && picoReaberto > 2,
          `reabrir o microfone mantém o filtro neural e o áudio (motor: ${supressao.motor}, pico ${picoReaberto})`
        );

        fonte.disconnect();
        analisador.disconnect();
        silencioso.disconnect();

        // E o contrário, que é onde já houve engano: só o filtro neural
        // aposenta a porta. É também o caminho do celular, que não publica o
        // modelo — por isso o motor é montado como `movel/nucleo.js` o monta.
        // Com o isolamento do sistema — que pode ser promessa vazia numa
        // máquina sem o recurso — ou com o nativo, tirar a porta deixaria a
        // pessoa sem defesa nenhuma e sem sinal disso.
        const motorSemNeural = new MotorDeAudio({
          supressao: new Supressao({
            carregarGtcrn: () => Promise.reject(new Error("recusado pelo teste")),
          }),
        });
        try {
          await motorSemNeural.aplicar(AUDIO_PADRAO);
          const fluxoSemNeural = await motorSemNeural.abrirMicrofone();
          const s = motorSemNeural.supressao;
          conferir(
            fluxoSemNeural.getAudioTracks().length === 1 &&
              ["sistema", "nativa"].includes(s.motor) &&
              !s.no &&
              s.portaFazSentido,
            `sem o modelo, cai para o supressor do sistema e a porta continua de pé (motor: ${s.motor})`
          );
        } finally {
          await motorSemNeural.encerrar().catch(() => {});
        }
      } catch (erro) {
        conferir(false, `execução sem exceções: ${erro?.message ?? erro}`);
      } finally {
        navigator.mediaDevices.getUserMedia = getUserMediaReal;
        fonteFala?.stop();
        fonteEntrada.disconnect();
        analisadorEntrada.disconnect();
        consumidorEntrada.disconnect();
        await contextoEntrada.close().catch(() => {});
        pararNivel();
        await motor.encerrar().catch(() => {});
      }

      await entregar({ falhas, relatorio });
      document.title = falhas ? "FALHOU" : "PASSOU";
      window.close();
    </script>
  </body>
</html>
