<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Teste da malha WebRTC</title>
    <style>
      body { font: 14px monospace; background: #111; color: #ddd; padding: 24px; }
      .ok { color: #4fc98c; }
      .falha { color: #e2645d; }
      h2 { font-size: 14px; margin: 18px 0 6px; color: #888; }
    </style>
  </head>
  <body>
    <h1 id="cabecalho">Executando…</h1>
    <div id="saida"></div>

    <script type="module">
      import { Sinal } from "../src/sinal.js";
      import { Malha, acharPerfilDeTela, ajustarOpus } from "../src/rtc.js";

      const entregar = (dados, rota = "/resultado") =>
        fetch(`http://127.0.0.1:8123${rota}`, {
          method: "POST",
          body: JSON.stringify(dados, null, 2),
        }).catch(() => {});

      const anotar = (dados) => entregar(dados, "/diagnostico");
      window.addEventListener("error", (e) => anotar({ erro: String(e.message) }));
      window.addEventListener("unhandledrejection", (e) => anotar({ erro: String(e.reason) }));
      await anotar({ etapa: "script iniciado" });

      const saida = document.getElementById("saida");
      const relatorio = [];
      let falhas = 0;

      const titulo = (t) => {
        const h = document.createElement("h2");
        h.textContent = t;
        saida.append(h);
      };

      const conferir = (condicao, descricao) => {
        if (!condicao) falhas++;
        relatorio.push({ ok: !!condicao, descricao });
        const linha = document.createElement("div");
        linha.className = condicao ? "ok" : "falha";
        linha.textContent = `${condicao ? "ok   " : "FALHA"} ${descricao}`;
        saida.append(linha);
      };

      const esperar = (ms) => new Promise((r) => setTimeout(r, ms));

      // rtc.js relata falhas de negociação no console; sem recolhê-las, uma
      // conexão que não fecha vira um número sem explicação.
      const errosDoConsole = [];
      for (const nivel of ["error", "warn"]) {
        const original = console[nivel].bind(console);
        console[nivel] = (...args) => {
          errosDoConsole.push(args.map((a) => a?.message ?? String(a)).join(" "));
          original(...args);
        };
      }

      /** Espera uma condição virar verdadeira, em vez de apostar num tempo fixo. */
      async function aguardar(condicao, limite = 15000) {
        const fim = Date.now() + limite;
        while (Date.now() < fim) {
          if (await condicao()) return true;
          await esperar(150);
        }
        return false;
      }

      /** Bytes efetivamente recebidos por uma conexão, para um tipo de mídia. */
      async function bytesRecebidos(pc, tipo = "audio") {
        let total = 0;
        for (const relatorio of await pc.getStats()) {
          const item = relatorio[1];
          if (item.type === "inbound-rtp" && item.kind === tipo) total += item.bytesReceived ?? 0;
        }
        return total;
      }

      /** Quadros de vídeo realmente decodificados por uma conexão. */
      async function quadrosDecodificados(pc) {
        let total = 0;
        for (const relatorio of await pc.getStats()) {
          const item = relatorio[1];
          if (item.type === "inbound-rtp" && item.kind === "video") total += item.framesDecoded ?? 0;
        }
        return total;
      }

      /** Áudio sintético: dispensa microfone e, portanto, permissões. */
      async function audioSintetico() {
        const ctx = new AudioContext();
        // Sem retomar o contexto, o motor não gera amostras e nada é enviado.
        await ctx.resume();
        const osc = ctx.createOscillator();
        const destino = ctx.createMediaStreamDestination();
        osc.frequency.value = 440;
        osc.connect(destino);
        osc.start();
        return destino.stream;
      }

      /** Vídeo sintético fazendo as vezes de captura de tela. */
      function videoSintetico() {
        const tela = document.createElement("canvas");
        tela.width = 320;
        tela.height = 180;
        const pincel = tela.getContext("2d");
        setInterval(() => {
          pincel.fillStyle = `hsl(${Date.now() / 20 % 360} 40% 30%)`;
          pincel.fillRect(0, 0, 320, 180);
        }, 100);
        return tela.captureStream(10);
      }

      /** Um participante completo: sinalização + malha. */
      function participante(apelido, registro) {
        const sinal = new Sinal();
        const contagem = { enviados: 0, recebidos: 0, saida: [], entrada: [] };
        const malha = new Malha({
          enviarSinal: (para, dados) => {
            contagem.enviados++;
            contagem.saida.push(dados.descricao ? `>${dados.descricao.type}` : ">cand");
            sinal.enviar({ tipo: "sinal", para, dados });
          },
          aoTrilha: (id, trilha, fluxo) =>
            registro.push({ apelido, evento: "trilha", tipo: trilha.kind, id, fluxo: fluxo?.id }),
          aoFimDeTrilha: (id, trilha) => registro.push({ apelido, evento: "fim", tipo: trilha.kind, id }),
          aoEstado: (id, estado) => registro.push({ apelido, evento: "estado", estado, id }),
        });
        // A malha se forma dentro de um canal de voz, e não no grupo inteiro.
        // O servidor anuncia entradas e saídas de voz ao grupo todo: só
        // interessam as do canal em que este participante está — abrir um elo
        // com quem entrou em outro canal criaria uma conexão que ninguém
        // negocia do outro lado.
        const eu = { canalVoz: null };
        sinal.addEventListener("entrou-voz", (e) => {
          if (e.detail.canal === eu.canalVoz) malha.abrir(e.detail.membro.id, false);
        });
        sinal.addEventListener("saiu-voz", (e) => {
          if (e.detail.canal === eu.canalVoz) malha.fechar(e.detail.id);
        });
        sinal.addEventListener("saiu", (e) => malha.fechar(e.detail.id));
        sinal.addEventListener("sinal", (e) => {
          contagem.recebidos++;
          contagem.entrada.push(
            e.detail.dados?.descricao ? `<${e.detail.dados.descricao.type}` : "<cand"
          );
          malha.receberSinal(e.detail.de, e.detail.dados);
        });
        return { apelido, sinal, malha, contagem, eu };
      }

      function diagnostico(participantes) {
        return participantes
          .map((p) => {
            const estados = [...p.malha.conexoes.values()]
              .map((pc) => `${pc.connectionState}/${pc.iceConnectionState}/${pc.iceGatheringState}`)
              .join(" ");
            return `${p.apelido} [${estados || "sem elos"}] saída:${p.contagem.saida.join(",")} entrada:${p.contagem.entrada.join(",")}`;
          })
          .join(" | ");
      }

      /** Entra no canal de voz e resolve com quem já estava lá. */
      async function entrarNaVoz(participante, canal) {
        const pronto = new Promise((resolver) =>
          participante.sinal.addEventListener("voz", (e) => resolver(e.detail), { once: true })
        );
        participante.sinal.enviar({ tipo: "entrar-voz", canal });
        const resposta = await pronto;
        participante.eu.canalVoz = resposta.canal;
        return resposta;
      }

      const ENDERECO = "ws://127.0.0.1:8899";
      const registro = [];

      try {
        titulo("Conexão da malha");

        const ana = participante("Ana", registro);
        const bruno = participante("Bruno", registro);

        const audioAna = await audioSintetico();
        const audioBruno = await audioSintetico();

        const bvAna = await ana.sinal.conectar(ENDERECO, {
          tipo: "criar-grupo",
          nome: "Malha",
          apelido: "Ana",
          usuario: "malha-ana",
        });
        ana.malha.definirIdentidade(bvAna.eu.id);
        ana.malha.definirAudioLocal(audioAna.getAudioTracks()[0], audioAna);
        conferir(!!bvAna.eu.id, "Ana criou o grupo");

        const canalVoz = bvAna.grupo.categorias
          .flatMap((c) => c.canais)
          .find((c) => c.tipo === "voz");
        conferir(!!canalVoz, "o grupo novo já traz um canal de voz");

        const bvBruno = await bruno.sinal.conectar(ENDERECO, {
          tipo: "entrar",
          codigo: bvAna.grupo.codigo,
          apelido: "Bruno",
          usuario: "malha-bruno",
        });
        bruno.malha.definirIdentidade(bvBruno.eu.id);
        bruno.malha.definirAudioLocal(audioBruno.getAudioTracks()[0], audioBruno);
        conferir(bvBruno.presentes.length === 1, "Bruno enxerga Ana ao entrar no grupo");

        const vozAna = await entrarNaVoz(ana, canalVoz.id);
        conferir(vozAna.pares.length === 0, "Ana chega primeiro ao canal de voz");

        const vozBruno = await entrarNaVoz(bruno, canalVoz.id);
        conferir(vozBruno.pares.length === 1, "Bruno encontra Ana no canal de voz");

        // Bruno chegou depois: é ele quem oferta.
        for (const par of vozBruno.pares) bruno.malha.abrir(par.id, true);

        const ligadas = () =>
          [...ana.malha.conexoes.values(), ...bruno.malha.conexoes.values()].filter(
            (pc) => pc.connectionState === "connected"
          ).length;

        const ligou = await aguardar(async () => ligadas() === 2);
        conferir(ligou, `conexão estabelecida nos dois lados (${ligadas()}/2)`);
        if (!ligou) {
          conferir(false, `diagnóstico — ${diagnostico([ana])}`);
          conferir(false, `diagnóstico — ${diagnostico([bruno])}`);
          for (const erro of errosDoConsole) conferir(false, `console — ${erro}`);
        }

        const audiosRecebidos = registro.filter((r) => r.evento === "trilha" && r.tipo === "audio");
        conferir(
          audiosRecebidos.some((r) => r.apelido === "Ana") && audiosRecebidos.some((r) => r.apelido === "Bruno"),
          "trilha de áudio negociada nos dois sentidos"
        );

        const fluindo = async () => {
          for (const pc of [...ana.malha.conexoes.values(), ...bruno.malha.conexoes.values()]) {
            if ((await bytesRecebidos(pc)) === 0) return false;
          }
          return true;
        };
        conferir(await aguardar(fluindo), "áudio realmente trafega (bytes recebidos nos dois lados)");

        titulo("Qualidade do áudio");

        // O que sai na descrição local é o que o outro lado lê para decidir o
        // que mandar para cá. Sem conferir o SDP, "ajustamos o Opus" é fé.
        const sdpAna = [...ana.malha.conexoes.values()][0].localDescription?.sdp ?? "";
        conferir(/a=fmtp:\d+ .*useinbandfec=1/.test(sdpAna), "o SDP pede correção de erro em banda (FEC)");
        conferir(/a=fmtp:\d+ .*maxaveragebitrate=128000/.test(sdpAna), "o SDP declara o teto de recepção do Opus");
        conferir(/a=fmtp:\d+ .*usedtx=0/.test(sdpAna), "o corte no silêncio (DTX) sai desligado por padrão");
        conferir(/a=fmtp:\d+ .*stereo=0/.test(sdpAna), "o SDP declara voz mono explicitamente");

        const remetenteDeAudio = (p) =>
          [...p.malha.conexoes.values()][0].getSenders().find((r) => r.track?.kind === "audio");

        await ana.malha.definirAudio({ bitrate: 96000 });
        conferir(
          remetenteDeAudio(ana)?.getParameters().encodings?.[0]?.maxBitrate === 96000,
          "o teto de banda do áudio chega ao remetente"
        );

        /** Taxa real de envio de áudio, medida na janela pedida. */
        const kbpsDeAudio = async (p, ms) => {
          const pc = [...p.malha.conexoes.values()][0];
          const ler = async () => {
            for (const [, item] of await pc.getStats()) {
              if (item.type === "outbound-rtp" && item.kind === "audio") return item.bytesSent ?? 0;
            }
            return 0;
          };
          const inicio = await ler();
          const t0 = performance.now();
          await esperar(ms);
          return (((await ler()) - inicio) * 8) / (performance.now() - t0);
        };

        // A prova que importa não é o número no objeto de parâmetros, é o
        // tráfego. Medir os dois extremos no mesmo sinal remove qualquer dúvida
        // sobre o ajuste ter sido aceito e ignorado.
        await ana.malha.definirAudio({ bitrate: 32000 });
        const kbpsBaixo = await kbpsDeAudio(ana, 3000);
        await ana.malha.definirAudio({ bitrate: 128000 });
        const kbpsAlto = await kbpsDeAudio(ana, 3000);
        conferir(
          kbpsAlto > kbpsBaixo * 1.8,
          `mudar a qualidade muda o tráfego de verdade (${kbpsBaixo.toFixed(0)} → ${kbpsAlto.toFixed(0)} kbps)`
        );
        await ana.malha.definirAudio({ bitrate: 64000 });

        titulo("Transmissão de tela");

        // A tela vai com som, como uma partilha de tela inteira no Windows.
        const tela = videoSintetico();
        const somDaTela = (await audioSintetico()).getAudioTracks()[0];
        tela.addTrack(somDaTela);
        ana.malha.publicarTela(tela.getVideoTracks()[0], tela, somDaTela);

        const recebeuVideo = await aguardar(async () =>
          registro.some((r) => r.evento === "trilha" && r.tipo === "video" && r.apelido === "Bruno")
        );
        conferir(recebeuVideo, "Bruno recebe a trilha de vídeo publicada por Ana");

        const pcDoBruno = [...bruno.malha.conexoes.values()][0];
        conferir(
          await aguardar(async () => (await bytesRecebidos(pcDoBruno, "video")) > 0),
          "vídeo realmente trafega (bytes recebidos)"
        );
        conferir(
          await aguardar(async () => (await quadrosDecodificados(pcDoBruno)) > 0),
          "quadros de vídeo são decodificados no destino"
        );
        conferir(
          !registro.some((r) => r.evento === "trilha" && r.tipo === "video" && r.apelido === "Ana"),
          "Ana não recebe de volta a própria transmissão"
        );

        titulo("Perfil da transmissão de tela");

        const remetenteDeTela = () =>
          [...ana.malha.conexoes.values()][0].getSenders().find((r) => r.track?.kind === "video");

        const equilibrado = acharPerfilDeTela("equilibrado");
        const codificacaoDaTela = () => remetenteDeTela()?.getParameters().encodings?.[0] ?? {};
        conferir(
          codificacaoDaTela().maxBitrate === equilibrado.bits &&
            codificacaoDaTela().maxFramerate === equilibrado.quadros,
          `o perfil padrão chega ao codificador (${equilibrado.detalhe})`
        );
        conferir(
          remetenteDeTela()?.getParameters().degradationPreference === equilibrado.degradacao,
          "a política de degradação é declarada (nitidez antes de fluidez)"
        );
        conferir(
          tela.getVideoTracks()[0].contentHint === equilibrado.dica,
          "a dica de conteúdo acompanha o perfil"
        );

        const nitido = acharPerfilDeTela("nitido");
        await ana.malha.definirPerfilTela(nitido);
        conferir(
          codificacaoDaTela().maxBitrate === nitido.bits &&
            codificacaoDaTela().maxFramerate === nitido.quadros,
          `trocar de perfil no meio da transmissão vale na hora (${nitido.detalhe})`
        );
        conferir(
          tela.getVideoTracks()[0].contentHint === nitido.dica &&
            remetenteDeTela()?.getParameters().degradationPreference === nitido.degradacao,
          "trocar de perfil também troca o que o codificador sacrifica"
        );

        // Qual codec foi realmente negociado. A preferência não é imposição —
        // se o motor não tiver o codec pedido, isto registra o que ele usou em
        // vez de reprovar por uma limitação do ambiente.
        const codecEmUso = async (pc) => {
          const relatorio = await pc.getStats();
          for (const [, item] of relatorio) {
            if (item.type === "outbound-rtp" && item.kind === "video" && item.codecId) {
              return relatorio.get(item.codecId)?.mimeType ?? "?";
            }
          }
          return "?";
        };
        const codec = await codecEmUso([...ana.malha.conexoes.values()][0]);
        conferir(codec !== "?", `codec de vídeo negociado: ${codec}`);

        await ana.malha.definirPerfilTela(equilibrado);

        titulo("Som que acompanha a transmissão");

        // A aplicação separa voz de som de tela pelo fluxo: o primeiro fluxo de
        // áudio de alguém é o microfone, e o que vier em outro é a transmissão.
        // Se as duas trilhas chegassem no mesmo fluxo, essa regra ruiria — e a
        // trilha sonora de um jogo passaria pelo medidor de fala.
        const vozesEsons = () =>
          registro.filter(
            (r) => r.apelido === "Bruno" && r.evento === "trilha" && r.tipo === "audio"
          );
        const chegaramAsDuas = await aguardar(async () => vozesEsons().length >= 2);
        const audiosDoBruno = vozesEsons();
        conferir(chegaramAsDuas, "Bruno recebe a voz e o som da tela como trilhas separadas");
        if (chegaramAsDuas) {
          conferir(
            audiosDoBruno[0].fluxo !== audiosDoBruno[1].fluxo,
            "o som da tela chega num fluxo diferente do da voz"
          );
          conferir(
            audiosDoBruno[1].fluxo ===
              registro.find((r) => r.apelido === "Bruno" && r.tipo === "video")?.fluxo,
            "o som da tela chega no mesmo fluxo do vídeo da tela"
          );
        }

        const remetenteDoSom = [...ana.malha.conexoes.values()][0]
          .getSenders()
          .filter((r) => r.track?.kind === "audio");
        conferir(
          remetenteDoSom.some((r) => r.getParameters().encodings?.[0]?.maxBitrate === 128000),
          "o som da tela sai no teto do codec, e não no bitrate de voz"
        );
        conferir(
          somDaTela.contentHint === "music",
          "o som da tela é marcado como música (nada de porta de ruído nele)"
        );

        titulo("Renegociação ao encerrar a transmissão");

        const antesDeParar = registro.length;
        ana.malha.retirarTela();
        await esperar(2500);

        const aindaConectado = registro
          .slice(antesDeParar)
          .every((r) => r.evento !== "estado" || ["connected", "connecting"].includes(r.estado));
        conferir(aindaConectado, "a chamada continua de pé depois de parar a tela");

        titulo("Saída de participante");

        bruno.sinal.desconectar();
        bruno.malha.fecharTudo();
        await esperar(1200);
        conferir(ana.malha.pares.length === 0, "Ana descarta o elo de quem saiu");

        ana.sinal.desconectar();
        ana.malha.fecharTudo();

        titulo("Porta de ruído");

        /**
         * A porta é medida fora do tempo real, num `OfflineAudioContext`. É a
         * única forma de julgá-la por números em vez de por opinião: o mesmo
         * sinal, sempre, e o resultado inteiro disponível para medir.
         *
         * O sinal tem três trechos de 48 kHz:
         *   0–2,0 s  ruído de sala a −58 dBFS  (a porta aprende o piso)
         *   2,0–3,0 s fala a −20 dBFS sobre o mesmo ruído
         *   3,0–4,0 s ruído de sala de novo
         */
        async function renderizarPorta({ ligada }) {
          const taxa = 48000;
          const ctx = new OfflineAudioContext(1, taxa * 4, taxa);
          await ctx.audioWorklet.addModule("../src/porta-de-ruido.js");

          const buffer = ctx.createBuffer(1, taxa * 4, taxa);
          const dados = buffer.getChannelData(0);
          const ruido = 10 ** (-58 / 20);
          const voz = 10 ** (-20 / 20);
          for (let i = 0; i < dados.length; i++) {
            const t = i / taxa;
            let amostra = (Math.random() * 2 - 1) * ruido;
            if (t >= 2 && t < 3) {
              // Fala aproximada: fundamental grave com dois harmônicos e uma
              // modulação silábica. Um seno puro não exercita nem o detector
              // nem o codificador de forma parecida com voz.
              const env = 0.6 + 0.4 * Math.sin(2 * Math.PI * 4 * (t - 2));
              amostra +=
                voz *
                env *
                (Math.sin(2 * Math.PI * 130 * t) * 0.6 +
                  Math.sin(2 * Math.PI * 390 * t) * 0.3 +
                  Math.sin(2 * Math.PI * 910 * t) * 0.1);
            }
            dados[i] = amostra;
          }

          const fonte = ctx.createBufferSource();
          fonte.buffer = buffer;
          const porta = new AudioWorkletNode(ctx, "porta-de-ruido", {
            outputChannelCount: [1],
            channelCount: 1,
            channelCountMode: "explicit",
          });
          porta.parameters.get("ativa").value = ligada ? 1 : 0;
          fonte.connect(porta);
          porta.connect(ctx.destination);
          fonte.start();

          const saida = (await ctx.startRendering()).getChannelData(0);
          const rms = (de, ate) => {
            let soma = 0;
            const i0 = Math.round(de * taxa);
            const i1 = Math.round(ate * taxa);
            for (let i = i0; i < i1; i++) soma += saida[i] * saida[i];
            return 20 * Math.log10(Math.sqrt(soma / (i1 - i0)) + 1e-12);
          };
          const rmsEntrada = (de, ate) => {
            let soma = 0;
            const i0 = Math.round(de * taxa);
            const i1 = Math.round(ate * taxa);
            for (let i = i0; i < i1; i++) soma += dados[i] * dados[i];
            return 20 * Math.log10(Math.sqrt(soma / (i1 - i0)) + 1e-12);
          };
          return { rms, rmsEntrada };
        }

        const ligada = await renderizarPorta({ ligada: true });

        // Silêncio depois de a porta ter tido tempo de medir a sala.
        const corteSilencio = ligada.rmsEntrada(1.5, 2.0) - ligada.rms(1.5, 2.0);
        conferir(corteSilencio > 15, `o ruído de sala é atenuado (${corteSilencio.toFixed(1)} dB)`);

        // Miolo da fala: aqui a porta não pode aparecer de forma nenhuma.
        const perdaNaFala = ligada.rmsEntrada(2.3, 2.9) - ligada.rms(2.3, 2.9);
        conferir(
          Math.abs(perdaNaFala) < 1,
          `a fala passa intacta (${perdaNaFala >= 0 ? "−" : "+"}${Math.abs(perdaNaFala).toFixed(2)} dB)`
        );

        // O defeito clássico de porta de ruído: comer o ataque da palavra. Os
        // primeiros 25 ms precisam já estar praticamente abertos.
        const ataque = ligada.rmsEntrada(2.0, 2.025) - ligada.rms(2.0, 2.025);
        conferir(ataque < 3, `o início da fala não é comido (${ataque.toFixed(1)} dB nos primeiros 25 ms)`);

        // E a cauda: fechar no instante em que a voz para produz um corte
        // audível. A permanência tem de segurar a porta aberta por um tempo.
        const caudaAberta = ligada.rmsEntrada(3.0, 3.1) - ligada.rms(3.0, 3.1);
        conferir(caudaAberta < 6, `a porta não fecha em cima da última sílaba (${caudaAberta.toFixed(1)} dB)`);

        const desligada = await renderizarPorta({ ligada: false });
        const desvio = Math.abs(desligada.rmsEntrada(1.5, 2.0) - desligada.rms(1.5, 2.0));
        conferir(desvio < 0.5, `desligada, a porta é transparente (${desvio.toFixed(2)} dB)`);

        titulo("Ajuste do Opus fora da conexão");
        const sdpCru = "v=0\r\nm=audio 9 UDP/TLS/RTP/SAVPF 111\r\na=rtpmap:111 opus/48000/2\r\na=fmtp:111 minptime=10;useinbandfec=1\r\n";
        const ajustado = ajustarOpus(sdpCru, { bitrate: 96000, dtx: true });
        conferir(ajustado.includes("maxaveragebitrate=96000"), "ajustarOpus escreve o teto pedido");
        conferir(ajustado.includes("usedtx=1"), "ajustarOpus respeita o pedido de DTX");
        conferir(
          (ajustado.match(/a=fmtp:111/g) ?? []).length === 1,
          "ajustarOpus substitui a linha fmtp em vez de duplicá-la"
        );
        conferir(
          ajustarOpus("v=0\r\nm=video 9 UDP/TLS/RTP/SAVPF 96\r\n", {}) ===
            "v=0\r\nm=video 9 UDP/TLS/RTP/SAVPF 96\r\n",
          "ajustarOpus deixa intacto um SDP sem Opus"
        );

        titulo("APIs de mídia disponíveis no motor");
        conferir(
          typeof navigator.mediaDevices?.getUserMedia === "function",
          "getUserMedia existe (captura de microfone)"
        );
        conferir(
          typeof navigator.mediaDevices?.getDisplayMedia === "function",
          "getDisplayMedia existe (captura de tela)"
        );
        try {
          const microfone = await navigator.mediaDevices.getUserMedia({ audio: true });
          conferir(microfone.getAudioTracks().length === 1, "getUserMedia devolve trilha de áudio");
          microfone.getTracks().forEach((t) => t.stop());
        } catch (erro) {
          conferir(false, `getUserMedia falhou: ${erro?.name ?? erro}`);
        }
      } catch (erro) {
        falhas++;
        conferir(false, `erro inesperado: ${erro?.message ?? erro}`);
      }

      document.getElementById("cabecalho").textContent =
        falhas === 0 ? "RESULTADO: todos os testes passaram" : `RESULTADO: ${falhas} falha(s)`;
      document.title = falhas === 0 ? "PASSOU" : "FALHOU";

      await entregar({ falhas, relatorio });
      window.close();
    </script>
  </body>
</html>
