<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Cena para captura</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0e0f11;
      }
      iframe {
        display: block;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!--
      Leva a aplicação real a um estado e para ali, para a captura.

      Não é teste: é o que permite olhar o desenho em vez de deduzi-lo da
      marcação. `?cena=` escolhe o que montar.

      A cena do cartão monta os dados à mão, injetando um módulo no documento
      da aplicação, em vez de ligar uma segunda pessoa de verdade — mais barato
      quando o que se quer olhar é só o desenho de um componente isolado. As
      cenas "voz" e "voz-chat" já ligam uma segunda pessoa real, pelo mesmo
      WebSocket cru que `rodar-perfil.ps1` usa: aqui o que se prova é a sala
      de voz de ponta a ponta — o quadro que `criarQuadroDeVoz` desenha de
      verdade, com a foto e a atividade que chegaram pela rede —, e uma
      marcação copiada à mão ficaria para trás na primeira vez que aquela
      função mudasse de forma (foi exatamente o que aconteceu aqui antes).
      Isso só é seguro porque a captura roda em tempo real, sem
      `--virtual-time-budget`: o `/segurar?ms=` abaixo é quem segura o
      `load` — em relógio de parede, o único que a rede concorda — enquanto a
      cena inteira, rede incluída, tem tempo de acontecer.
    -->
    <!-- Sem `src`: precisa nascer depois de semear `localStorage`, ver abaixo. -->
    <iframe id="app" width="1180" height="760"></iframe>
    <!-- Segura o `load` da página, que é quando a captura dispara, enquanto a
         cena se monta. Fica fora do fluxo para não empurrar o quadro nem um
         pixel. Ver o comentário em `servir.mjs`. As cenas "voz"/"voz-chat"
         são as mais lentas — criam grupo, ligam uma segunda pessoa e entram
         na voz de verdade —, por isso a folga generosa. -->
    <img src="/segurar?ms=14000" alt="" style="position: absolute; top: 0; left: 0; opacity: 0" />

    <script type="module">
      const params = new URLSearchParams(location.search);
      const cena = params.get("cena") ?? "entrada";
      const servidor = params.get("servidor") ?? "ws://127.0.0.1:8898";

      const quadro = document.getElementById("app");

      // O endereço do servidor deixou de ser campo da tela de entrada e virou
      // preferência (ver `rodar-perfil.ps1`), então semear antes de carregar é
      // o único jeito de o aplicativo nascer apontado para o servidor local
      // deste teste — sem isto, toda ação de rede desta cena (criar grupo
      // incluído) iria para o servidor de produção, `SERVIDOR_PADRAO` em
      // `app.js`. A página e o quadro têm a mesma origem, logo o mesmo
      // `localStorage`.
      localStorage.setItem("call.preferencias", JSON.stringify({ servidor }));
      quadro.src = "/src/index.html";
      await new Promise((r) => quadro.addEventListener("load", r, { once: true }));
      const doc = quadro.contentDocument;
      const jan = quadro.contentWindow;
      const $ = (id) => doc.getElementById(id);
      const esperar = (ms) => new Promise((r) => setTimeout(r, ms));
      const prefs = () => JSON.parse(jan.localStorage.getItem("call.preferencias") ?? "{}");

      // Sem isto a captura pega o painel no meio do surgimento, meio
      // transparente: a captura roda em tempo real, e um `transition` ou uma
      // animação em andamento no instante do `load` renderiza pela metade.
      if (params.get("movimento") !== "sim") {
        const parado = doc.createElement("style");
        parado.textContent = "*, *::before, *::after { animation: none !important; transition: none !important; }";
        doc.head.append(parado);
      }
      const teclar = (elemento, valor) => {
        elemento.value = valor;
        elemento.dispatchEvent(new jan.Event("input"));
      };
      const aguardar = async (teste, limite = 8000) => {
        const fim = Date.now() + limite;
        while (Date.now() < fim) {
          if (teste()) return true;
          await esperar(100);
        }
        return false;
      };

      /** O jeito real de criar um grupo: o "+" do trilho abre um menu, e só
       *  o item escolhido chama `editarGrupo` — que é quem monta o diálogo
       *  com `grupo-nome`/`grupo-confirmar`. Devolve o código do convite,
       *  lido das preferências salvas (como `rodar-perfil.ps1` já faz), e
       *  não de um elemento de tela que não existe mais. */
      async function criarGrupoReal(nome) {
        doc.querySelector(".grupo--novo").click();
        await esperar(150);
        [...$("menu").children].find((item) => item.textContent === "Criar grupo").click();
        await esperar(150);
        teclar($("grupo-nome"), nome);
        $("grupo-confirmar").click();
        await aguardar(() => prefs().atalhos?.[0]?.codigo?.length === 10);
        return prefs().atalhos[0].codigo;
      }

      if (cena === "entrada") {
        $("criar-apelido").value = "Alan";
        $("criar-apelido").dispatchEvent(new jan.Event("input"));
        document.title = "PRONTO";
      } else if (cena === "login") {
        // A folha de entrar, que é a que quase todo mundo vê a partir da
        // segunda instalação.
        doc.querySelector('[data-aba="entrar"]').click();
        await esperar(400);
        $("entrar-email").value = "alan@exemplo.com";
        $("entrar-email").dispatchEvent(new jan.Event("input"));
        $("entrar-senha").value = "coruja-de-brasilia-22";
        document.title = "PRONTO";
      } else if (cena === "cadastro") {
        // A folha de cadastro preenchida, para a captura do portal.
        $("criar-apelido").value = "Alan";
        $("criar-apelido").dispatchEvent(new jan.Event("input"));
        $("criar-email").value = "alan@exemplo.com";
        $("criar-email").dispatchEvent(new jan.Event("input"));
        $("criar-senha").value = "coruja-de-brasilia-22";
        $("criar-senha").dispatchEvent(new jan.Event("input"));
        document.title = "PRONTO";
      } else {
        $("criar-apelido").value = "Alan";
        $("botao-sem-conta").click();
        await esperar(400);

        if (cena === "editor") {
          $("botao-perfil").click();
          await esperar(200);
          teclar($("perfil-apelido"), "Alan Araújo");
          teclar($("perfil-bio"), "Brasília, GMT-3. Por aqui à noite, quase sempre num canal de voz.");
          $("perfil-mascotes").children[3].click();
        }

        if (cena === "grupo") {
          const codigo = await criarGrupoReal("Estúdio");

          const gente = [
            ["Bruna", "bruna-x", "raposa", "Front-end de dia, Valorant de noite."],
            ["Caio", "caio-x", "capivara", "Se eu sumir, fui fazer café."],
            ["Dani", "dani-x", "axolote", ""],
            ["Enzo", "enzo-x", "dragao", "Rank ou nada."],
          ];
          for (const [apelido, usuario, avatar, bio] of gente) {
            const par = new WebSocket(servidor);
            await new Promise((ok) => par.addEventListener("open", ok, { once: true }));
            par.send(JSON.stringify({ tipo: "entrar", codigo, apelido, usuario, avatar, bio }));
            await esperar(120);
          }
          await aguardar(() => $("lista-participantes").children.length === 5);
        }

        if (cena === "voz" || cena === "voz-chat") {
          // Sala de voz real, com uma segunda pessoa de verdade entrando pelo
          // WebSocket — e não marcação copiada à mão. A versão anterior
          // desenhava `.presenca` no braço, e ficou para trás na primeira vez
          // que `criarQuadroDeVoz` mudou de forma: aqui quem desenha é o
          // código real, então a cena não pode ficar desatualizada de novo.
          const codigo = await criarGrupoReal("Estúdio");

          // 1×1 PNG válido, só para provar que o cartão e o quadro de voz
          // pintam uma foto de verdade em vez de caírem no mascote.
          const FOTO_EXEMPLO =
            "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=";

          const par = new WebSocket(servidor);
          await new Promise((ok) => par.addEventListener("open", ok, { once: true }));
          const vozId = await new Promise((ok) => {
            par.addEventListener("message", function ouvir(e) {
              const msg = JSON.parse(e.data);
              if (msg.tipo !== "bem-vindo") return;
              par.removeEventListener("message", ouvir);
              const voz = msg.grupo.categorias.flatMap((c) => c.canais).find((c) => c.tipo === "voz");
              ok(voz.id);
            });
            par.send(
              JSON.stringify({
                tipo: "entrar",
                codigo,
                apelido: "Bruna",
                usuario: "bruna-cena",
                avatar: "raposa",
                bio: "Front-end de dia, Valorant de noite.",
                foto: FOTO_EXEMPLO,
              })
            );
          });
          par.send(JSON.stringify({ tipo: "entrar-voz", canal: vozId, transportes: ["malha"] }));
          await esperar(250);
          // Sem `mudo`, o campo cai no padrão do servidor — declarado aqui só
          // para deixar explícito que ela está com o microfone aberto.
          par.send(JSON.stringify({ tipo: "estado", mudo: false, atividade: "Visual Studio Code" }));

          // Eu entro na voz de verdade, pelo canal real — mesmo microfone
          // falso que o resto da suíte usa (`--use-fake-device-for-media-stream`).
          doc.querySelector('.canal[data-tipo="voz"] .canal__alvo').click();
          await aguardar(() => $("palco-grade").children.length === 2, 10000);

          if (cena === "voz-chat") {
            $("botao-chat-da-sala").click();
            await esperar(200);
            const campo = $("campo-mensagem");
            campo.textContent = "Chego em cinco minutos, olha o roteiro: http://exemplo.com/roteiro-da-call.";
            $("redator").dispatchEvent(new jan.Event("submit", { cancelable: true }));
            await esperar(300);
          }

          // Muta o próprio microfone por último — é a troca de desenho do
          // ícone (e não só de cor) que este selo prova.
          $("botao-microfone").click();
          await esperar(150);
        }

        if (cena === "cartao") {
          // Um `<script type="module">` inserido no documento da aplicação roda
          // no mesmo reino que ela — o `import` acha a mesma instância do
          // módulo, e o cartão desenha na marcação real, com o CSS real.
          const injetado = doc.createElement("script");
          injetado.type = "module";
          injetado.textContent = `
            import { mostrarCartao } from "/src/perfil.js";
            mostrarCartao({
              apelido: "Bruna",
              avatar: "raposa",
              bio: "Front-end de dia, Valorant de noite. Se eu estiver muda, é porque o gato subiu na mesa.",
              atividade: "Visual Studio Code",
              etiquetas: ["dono", "na voz"],
              acoes: [{ rotulo: "Ajustar volume…", fazer: () => {} }],
            });
          `;
          doc.body.append(injetado);
          await aguardar(() => !$("cartao-dialogo").classList.contains("oculto"));
        }

        await esperar(400);
        document.title = "PRONTO";
      }
    </script>
  </body>
</html>
